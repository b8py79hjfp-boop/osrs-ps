# cargo deny check (panel brief §0.4, §8): licences, advisories, bans, sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml is unmaintained (not a vulnerability). Only askama's derive macro uses it, at compile time, to read
    # askama's own config; no input from users reaches it. Revisit when askama replaces it.
    { id = "RUSTSEC-2026-0374", reason = "compile-time only, via askama_derive" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC",
    "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "0BSD", "BSL-1.0", "CC0-1.0",
]
confidence-threshold = 0.9
# Our own crates are private (publish = false), not licensed for distribution.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
