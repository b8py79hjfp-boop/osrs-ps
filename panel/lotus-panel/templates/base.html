<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{% block title %}Lotus panel{% endblock %}</title>
  <link rel="stylesheet" href="/assets/panel.css">
  <link rel="icon" href="/assets/lotus.png">
  <script src="/assets/htmx.min.js" defer></script>
  <script src="/assets/sse.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/assets/lotus.png" alt="" width="28" height="28"><span>Lotus panel</span></a>
    {% if let Some(n) = nav %}
    <nav>
      {% for l in n.links %}<a href="{{ l.href }}">{{ l.label }}</a>{% endfor %}
    </nav>
    <form method="post" action="/logout" class="who">
      <span>{{ n.name }} <span class="badge">{{ n.rank }}</span></span>
      <input type="hidden" name="csrf" value="{{ n.csrf }}">
      <button type="submit" class="link">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
