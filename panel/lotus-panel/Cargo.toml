[package]
name = "lotus-panel"
version = "0.1.0"
description = "Lotus control panel (panel/docs/brief.md)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "query", "form", "macros"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
http = "1.3"
mime_guess = "2.0.5"
prost = "0.14.4"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "time"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-std", "io-util"] }
toml = "1.2.1"
tonic = { version = "0.14.9", default-features = false, features = ["transport", "codegen", "tls-ring"] }
tonic-prost = "0.14.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-gzip", "timeout", "request-id", "set-header", "trace", "limit", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
http-body-util = "0.1"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.9"
