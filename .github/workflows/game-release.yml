name: game-release

# A signed Lotus release for the control panel's Deploys page (panel brief section 6): the hub and world jars,
# release.json and schema.sql in lotus.zip, signed with minisign (lotus.zip.minisig), published as the GitHub release
# "lotus-<version>". Windows only, like the VPS. Runs by hand (Actions > game-release > Run workflow).
#
# Needs two repository secrets: LOTUS_RELEASE_KEY (the secret key file's text, from `lotus-panel release keygen`) and
# LOTUS_RELEASE_KEY_PASSWORD. The matching public key goes in panel.toml [deploy] public_key on the VPS.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # Jagex data never enters git (brief §0.6): fetch it from OpenRS2 (symbols are generated from it).
      - uses: actions/cache@v6
        with:
          path: .data/cache
          key: js5-${{ hashFiles('gradle.properties', 'gradle/cache-checksums/**') }}

      - name: Download and verify cache
        run: ./gradlew setup

      - name: Build the server and the hub
        run: ./gradlew :server:installDist :hub:installDist

      - name: Assemble
        id: assemble
        run: |
          $short = (git rev-parse --short=7 HEAD).Trim()
          $version = "{0}-{1}" -f (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd-HHmm'), $short
          $previous = git tag --list 'lotus-*' --sort=-creatordate | Select-Object -First 1
          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          $commits = @(git log --format=%s -n 50 $range)
          ./deploy/windows/make-release.ps1 -Repo . -Version $version -Out "release/$version" -Zip lotus.zip -Commits $commits
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Sign
        env:
          LOTUS_RELEASE_KEY: ${{ secrets.LOTUS_RELEASE_KEY }}
          LOTUS_RELEASE_KEY_PASSWORD: ${{ secrets.LOTUS_RELEASE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:LOTUS_RELEASE_KEY) { throw 'Set the LOTUS_RELEASE_KEY and LOTUS_RELEASE_KEY_PASSWORD secrets first (panel/docs/operations.md).' }
          gh release download panel-latest -p lotus-panel.exe -D tools
          ./tools/lotus-panel.exe release sign lotus.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.assemble.outputs.version }}'
          gh release create "lotus-$v" lotus.zip lotus.zip.minisig --title "Lotus $v" `
            --notes "Built from $env:GITHUB_SHA. Deploy it from the control panel's Deploys page."
