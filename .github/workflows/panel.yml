name: panel

# The Lotus control panel (panel/), built and checked on Windows only: format, clippy (-D warnings), tests, cargo
# deny, then the binary the VPS installer downloads (deploy/windows/install-lotus.ps1). Pushes to main publish it as the "panel-latest" release.

on:
  push:
    paths:
      - "panel/**"
      - "services/src/main/proto/**"
      - ".github/workflows/panel.yml"
  pull_request:
    paths:
      - "panel/**"
      - "services/src/main/proto/**"
      - ".github/workflows/panel.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Checked queries compile from panel/.sqlx (cargo sqlx prepare), with no database in CI.
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  # Windows only, like the VPS: format, clippy, tests and cargo deny, then the release build.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: panel
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo build --locked --release
      - name: Checksum
        run: |
          Copy-Item target/release/lotus-panel.exe lotus-panel.exe
          (Get-FileHash lotus-panel.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline lotus-panel.exe.sha256
          Get-Content lotus-panel.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lotus-panel-windows
          path: |
            panel/lotus-panel.exe
            panel/lotus-panel.exe.sha256
      - name: Publish panel-latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete panel-latest --yes --cleanup-tag
          gh release create panel-latest lotus-panel.exe lotus-panel.exe.sha256 --prerelease `
            --title "Lotus panel (latest main)" --notes "Built from $env:GITHUB_SHA. Installed by deploy/windows/install-lotus.ps1."
