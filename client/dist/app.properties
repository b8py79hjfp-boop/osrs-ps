# Packaging settings (package.sh). Placeholders until the name and branding are chosen (docs/plans/phase-6.md).
# `name` and `id` must equal name/id in client/launcher/src/main/resources/tp/client/launcher/launcher.properties:
# package.sh checks it, because the launcher keeps its files in ~/.<id>.
name=tickperfect
id=tickperfect
vendor=tickperfect
description=tickperfect game client launcher
# Version of the installer package only (jpackage: Windows needs major.minor.build, macOS needs major > 0). The client
# itself is versioned by the signed manifest and updates without reinstalling. CI overrides with INSTALLER_VERSION.
installer.version=1.0.0
# Windows MSI upgrade code. Never change it after the first public release or installed copies cannot be upgraded.
win.upgrade.uuid=83f55ca5-f0f8-43a6-a83a-ac730f2be1a9
# Linux package metadata
linux.maintainer=admin@example.invalid
linux.category=games
mac.bundle.id=net.tickperfect.client
