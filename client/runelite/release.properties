# Release tokens substituted into the fork by build.sh (non-secret, committed).
# The patches use the tokens @@NAME@@, @@SITE@@ and @@API@@ so they stay generic.

# Product name shown to the player (window title, splash, About) and used for the data directory (~/.<name>).
name=Lotus

# Hub HTTP base URL; the game's jav_config is served at <site>/jav_config.ws. The live VPS (docs/VPS.md).
site=http://194.238.27.209:8080

# Base URL of the RuneLite API the hub serves (see ENDPOINTS.md). The live VPS.
api=http://194.238.27.209:8080/runelite

# Plugin policy: `allowlist` loads only the plugins in allowlist.txt and has no Plugin Hub; `open` enables the
# Plugin Hub and loads every plugin (patches-open/, README.md "Plugin modes"). Open for now, at the owner's request.
plugins=open

# The RuneLite commit the tag must resolve to (D-007 / D-028). The build stops if the tag points elsewhere.
base.commit=d62b158e83450b0708f053c753e3508c762a0803
