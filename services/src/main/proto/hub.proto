// Hub API (brief §7): schema-first, callable from world-nodes and from any language (website, admin panel).
// World-nodes use it through tp.services.HubServices (GrpcHubClient); the hub serves it (HubGrpcServer).
syntax = "proto3";

package tp.hub.v1;

option java_multiple_files = true;
option java_package = "tp.services.grpc";

message Empty {}

// ---- accounts and saves

message LoginRequest {
  string username = 1;
  string password = 2;
  int32 world_id = 3;
  string ip = 4;
  string device = 5; // login block uuid as hex, empty = none (commands brief §6)
}

message LoginReply {
  string result = 1; // tp.services.LoginResult name
  int64 account_id = 2;
  string display_name = 3;
  string rights = 4; // tp.services.Rights name
  string save = 5;   // versioned save JSON, empty = new character
  bool has_save = 6;
  reserved 7; // muted_until, now inside sanctions
  SanctionsPb sanctions = 8;
  string donator = 9; // tp.util.DonatorTier name (D-093)
}

// Commands brief §7: the sanctions in force on an account (0 = none, -1 = permanent).
message SanctionsPb {
  sint64 muted_until = 1;
  string mute_reason = 2;
  sint64 yell_muted_until = 3;
  string yell_mute_reason = 4;
  sint64 jailed_until = 5;
  string jail_reason = 6;
}

message LogoutRequest {
  int64 account_id = 1;
  int32 world_id = 2;
  string save = 3;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string ip = 3;
}

message ErrorReply {
  string error = 1; // empty = success
}

message SaveRequest {
  int64 account_id = 1;
  int32 world_id = 2;
  string save = 3;
}

message ChangePasswordRequest {
  int64 account_id = 1;
  string current = 2;
  string new_password = 3;
}

service Accounts {
  rpc Login(LoginRequest) returns (LoginReply);
  rpc ChangePassword(ChangePasswordRequest) returns (ErrorReply);
  rpc Logout(LogoutRequest) returns (Empty);
  rpc Register(RegisterRequest) returns (ErrorReply);
  rpc Save(SaveRequest) returns (Empty);
}

// ---- worlds

message World {
  int32 id = 1;
  string host = 2;
  int32 port = 3;
  string activity = 4;
  int32 flags = 5;
  int32 population = 6;
}

message Heartbeat {
  int32 world_id = 1;
  int32 population = 2;
}

message WorldList {
  repeated World worlds = 1;
}

service Worlds {
  rpc Register(World) returns (Empty);
  rpc Beat(Heartbeat) returns (Empty);
  rpc List(Empty) returns (WorldList);
}

// ---- social

message AccountRef {
  int64 account_id = 1;
}

message NameRequest {
  int64 account_id = 1;
  string name = 2;
}

message Friend {
  string name = 1;
  int32 world_id = 2;
  sint32 rank = 3;
}

message FriendList {
  repeated Friend friends = 1;
}

message NameList {
  repeated string names = 1;
}

message PrivateMessageRequest {
  int64 from_account = 1;
  string to_name = 2;
  string text = 3;
}

message WorldRef {
  int32 world_id = 1;
}

message SocialEvent {
  int64 to_account = 1;
  reserved 4; // Muted, replaced by sanctioned
  oneof event {
    PrivateMessage private_message = 2;
    FriendStatus friend_status = 3;
    ChannelJoined channel_joined = 5;
    ChannelLeft channel_left = 6;
    ChannelMemberUpdate channel_member = 7;
    ChannelMessage channel_message = 8;
    ClanState clan_state = 9;
    ClanMessage clan_message = 10;
    ClanInvite clan_invite = 11;
    SanctionsPb sanctioned = 12;
    Warned warned = 13;
    RankChanged rank_changed = 14;
    DonatorChanged donator_changed = 15;
  }
}

message ClanRules {
  sint32 talk_rank = 1;
  sint32 kick_rank = 2;
  bool allow_guests = 3;
  sint32 recruit_rank = 4;
}

message ClanMemberRow {
  int64 account_id = 1;
  string name = 2;
  sint32 rank = 3;
  int32 joined_day = 4;
}

message ClanRecord {
  int64 id = 1;
  string name = 2;
  int64 created_minute = 3;
  repeated ClanMemberRow members = 4;
  repeated string banned = 5;
  ClanRules rules = 6;
}

message ClanState {
  bool guest = 1;
  ClanRecord clan = 2; // absent = left
  repeated ChannelMember online = 3;
}

message ClanMessage {
  bool guest = 1;
  string clan_name = 2;
  string from = 3;
  string from_rights = 4;
  sint32 rank = 5;
  int32 world_id = 6;
  string text = 7;
}

message ClanInvite {
  string from = 1;
  string clan_name = 2;
}

message ClanKickRequest {
  int64 account_id = 1;
  string name = 2;
  bool ban = 3;
}

message ClanRulesRequest {
  int64 account_id = 1;
  ClanRules rules = 2;
}

message ClanMessageRequest {
  int64 account_id = 1;
  bool guest = 2;
  string text = 3;
}

message ChannelLeft {
  bool kicked = 1;
}

message ChannelMember {
  string name = 1;
  int32 world_id = 2;
  sint32 rank = 3;
}

message ChannelJoined {
  string owner = 1;
  string channel_name = 2;
  sint32 kick_rank = 3;
  repeated ChannelMember members = 4;
}

message ChannelMemberUpdate {
  ChannelMember member = 1;
  bool removed = 2;
}

message ChannelMessage {
  string from = 1;
  string from_rights = 2;
  string channel_name = 3;
  int32 world_id = 4;
  string text = 5;
}

message ChannelSettings {
  string name = 1; // empty = disabled
  sint32 enter_rank = 2;
  sint32 talk_rank = 3;
  sint32 kick_rank = 4;
}

message ChannelSettingsRequest {
  int64 account_id = 1;
  ChannelSettings settings = 2;
}

message RankRequest {
  int64 account_id = 1;
  string name = 2;
  sint32 rank = 3;
}

// Mute applied/lifted while online (epoch ms; 0 = unmuted, negative = permanent).
message Warned {
  string reason = 1;
}

message PrivateMessage {
  string from = 1;
  string from_rights = 2;
  string text = 3;
}

message FriendStatus {
  string name = 1;
  int32 world_id = 2;
}

service Social {
  rpc Friends(AccountRef) returns (FriendList);
  rpc Ignores(AccountRef) returns (NameList);
  rpc AddFriend(NameRequest) returns (ErrorReply);
  rpc RemoveFriend(NameRequest) returns (Empty);
  rpc AddIgnore(NameRequest) returns (ErrorReply);
  rpc RemoveIgnore(NameRequest) returns (Empty);
  rpc SendPrivateMessage(PrivateMessageRequest) returns (ErrorReply);
  rpc JoinChannel(NameRequest) returns (ErrorReply);
  rpc LeaveChannel(AccountRef) returns (Empty);
  rpc ChannelMessage(NameRequest) returns (ErrorReply); // name = message text
  rpc ChannelKick(NameRequest) returns (ErrorReply);
  rpc SetChannelRank(RankRequest) returns (ErrorReply);
  rpc GetChannelSettings(AccountRef) returns (ChannelSettings);
  rpc SetChannelSettings(ChannelSettingsRequest) returns (Empty);
  rpc ClanFound(NameRequest) returns (ErrorReply);
  rpc ClanInvite(NameRequest) returns (ErrorReply);
  rpc ClanAccept(AccountRef) returns (ErrorReply);
  rpc ClanLeave(AccountRef) returns (ErrorReply);
  rpc ClanSetRank(RankRequest) returns (ErrorReply);
  rpc ClanKick(ClanKickRequest) returns (ErrorReply);
  rpc ClanSetRules(ClanRulesRequest) returns (ErrorReply);
  rpc ClanJoinGuest(NameRequest) returns (ErrorReply);
  rpc ClanLeaveGuest(AccountRef) returns (Empty);
  rpc ClanMessage(ClanMessageRequest) returns (ErrorReply);
  rpc Subscribe(WorldRef) returns (stream SocialEvent);
}

// ---- Grand Exchange skeleton

message GeOffer {
  int64 id = 1;
  int64 account_id = 2;
  int32 slot = 3;
  bool buy = 4;
  int32 obj = 5;
  int32 quantity = 6;
  int32 price = 7;
  int32 completed = 8;
  int64 collect_coins = 9;
  int32 collect_items = 10;
  int64 gold = 11;
  bool aborted = 12;
  int32 tax_rate = 13;
  int64 tax = 14;
}

message PlaceOfferRequest {
  int64 account_id = 1;
  int32 slot = 2;
  bool buy = 3;
  int32 obj = 4;
  int32 quantity = 5;
  int32 price = 6;
  int32 tax_rate = 7;
}

message SlotRequest {
  int64 account_id = 1;
  int32 slot = 2;
  // 0 all, 1 items, 2 coins (CollectPart ordinal)
  int32 part = 3;
}

message GeOffers {
  repeated GeOffer offers = 1;
}

message MaybeOffer {
  bool present = 1;
  GeOffer offer = 2;
}

// ---------------------------------------------------------------- trading post (custom)

message TpListingPb {
  int64 id = 1;
  int64 account_id = 2;
  string seller = 3;
  int32 obj = 4;
  int32 quantity = 5;
  int32 sold = 6;
  int32 price = 7;
  int64 listed_at = 8;
  bool closed = 9;
}

message TpListings { repeated TpListingPb listings = 1; }

message TpMaybeListing {
  bool present = 1;
  TpListingPb listing = 2;
}

message TpListRequest {
  int64 account_id = 1;
  string seller = 2;
  int32 obj = 3;
  int32 quantity = 4;
  int32 price = 5;
  int32 max_listings = 6;
}

message TpIdRequest {
  int64 account_id = 1;
  int64 id = 2;
}

message TpSearchRequest {
  bool by_obj = 1;
  repeated int32 objs = 2;
  string seller = 3; // empty = any
  int32 limit = 4;
}

message TpBuyRequest {
  int64 account_id = 1;
  string buyer = 2;
  int64 id = 3;
  int32 quantity = 4;
  int32 price = 5;
}

message TpBuyReply {
  int32 bought = 1;
  bool has_listing = 2;
  TpListingPb listing = 3;
  string error = 4; // empty = none
}

message TpCollectPb {
  int64 coins = 1;
  repeated int32 objs = 2;
  repeated int32 counts = 3;
}

message TpTradePb {
  int64 account_id = 1;
  int32 obj = 2;
  int32 quantity = 3;
  int32 price = 4;
  bool bought = 5;
  string other = 6;
  int64 at = 7;
}

message TpTrades { repeated TpTradePb trades = 1; }

service TradingPost {
  rpc List(TpListRequest) returns (TpMaybeListing);
  rpc Cancel(TpIdRequest) returns (TpMaybeListing);
  rpc Search(TpSearchRequest) returns (TpListings);
  rpc Mine(AccountRef) returns (TpListings);
  rpc Buy(TpBuyRequest) returns (TpBuyReply);
  rpc Collect(AccountRef) returns (TpCollectPb);
  rpc Pending(AccountRef) returns (TpCollectPb);
  rpc History(AccountRef) returns (TpTrades);
}

service Exchange {
  rpc Place(PlaceOfferRequest) returns (GeOffer);
  rpc Offers(AccountRef) returns (GeOffers);
  rpc Collect(SlotRequest) returns (MaybeOffer);
  rpc Abort(SlotRequest) returns (MaybeOffer);
  rpc History(AccountRef) returns (GeOffers);
  rpc GuidePrices(Empty) returns (GuidePriceList);
}

message GuidePrice {
  int32 obj = 1;
  int32 price = 2;
}

message GuidePriceList {
  repeated GuidePrice prices = 1;
}

// ---- hiscores, moderation, broadcasts

message HiscoreSubmit {
  int64 account_id = 1;
  string name = 2;
  repeated int32 xp_tenths = 3;
}

message HiscoreQuery {
  int32 stat = 1;
  int32 count = 2;
}

message HiscoreEntry {
  string name = 1;
  int32 level = 2;
  int64 xp = 3;
}

message HiscoreTable {
  repeated HiscoreEntry entries = 1;
}

service Hiscores {
  rpc Submit(HiscoreSubmit) returns (Empty);
  rpc Top(HiscoreQuery) returns (HiscoreTable);
}

message SanctionRequest {
  int64 staff_account = 1;
  string target = 2;
  string sanction = 3; // tp.util.Sanction name
  reserved 4; // minutes
  string reason = 5;
  sint64 duration_ms = 6; // -1 = permanent
}

message ModQuery {
  int64 staff_account = 1;
  string target = 2;
  string kind = 3; // investigate: "alts", "ips" or "audit"
  string filter = 4; // investigate "audit": text the row must contain
}

message SetRankRequest {
  int64 staff_account = 1;
  string target = 2;
  string rank = 3; // tp.util.Rank stored value
}

message RenameRequest {
  int64 staff_account = 1;
  string target = 2;
  string new_name = 3;
}

message RankChanged {
  string rank = 1;
}

message LinesReply {
  string error = 1; // empty = ok
  repeated string lines = 2;
}

message ModRecordPb {
  int64 id = 1;
  int64 account_id = 2;
  string type = 3; // tp.util.RecordType name
  string actor = 4;
  string reason = 5;
  int64 start = 6;
  sint64 expires = 7;
  string scope = 8;
  string lifted_by = 9;
  int64 lifted_at = 10;
}

message HistoryReply {
  string error = 1; // empty = ok
  repeated ModRecordPb records = 2;
}

message LookupReply {
  string error = 1; // empty = ok
  int64 account_id = 2;
  string name = 3;
  string rank = 4;
  int32 world = 5;
  SanctionsPb sanctions = 6;
  sint64 banned_until = 7;
  int32 records = 8;
  string last_ip = 9;
  string donator = 10;
  int64 donated_cents = 11;
}

message DonationRequest {
  int64 staff_account = 1;
  string target = 2;
  int64 cents = 3;
  string note = 4;
}

message DonationReply {
  string error = 1; // empty = ok
  string tier = 2;
}

message DonatorChanged {
  string tier = 1;
}

message Kick {
  int64 account_id = 1;
}

message AuditRequest {
  string actor = 1;
  string action = 2;
  string target = 3;
  string detail = 4;
}

service Moderation {
  rpc Apply(SanctionRequest) returns (ErrorReply);
  rpc History(ModQuery) returns (HistoryReply);
  rpc Lookup(ModQuery) returns (LookupReply);
  rpc Investigate(ModQuery) returns (LinesReply);
  rpc SetRank(SetRankRequest) returns (ErrorReply);
  rpc Rename(RenameRequest) returns (ErrorReply);
  rpc RecordDonation(DonationRequest) returns (DonationReply);
  // Commands brief §4: a command execution for the append-only audit log.
  rpc Audit(AuditRequest) returns (Empty);
  rpc SubscribeKicks(WorldRef) returns (stream Kick);
}

message BroadcastRequest {
  string text = 1;
}

message SystemUpdateRequest {
  int32 seconds = 1;
}

message PresencePb {
  int64 account_id = 1;
  string name = 2;
  int32 world_id = 3;
  string rank = 4; // tp.util.Rank stored value
  bool invisible = 5;
}

message PresenceUpdate {
  repeated PresencePb online = 1;
  repeated int64 offline = 2;
  bool snapshot = 3;
}

message YellRequest {
  string from = 1;
  string rank = 2;
  int32 world_id = 3;
  string text = 4;
  string donator = 5; // tp.util.DonatorTier name (D-095: yell icon and name colour)
  bool staff = 6; // D-096 ::sc staff chat: delivered to staff only
}

message InvisibleRequest {
  int64 account_id = 1;
  bool invisible = 2;
}

message BroadcastEvent {
  oneof event {
    string message = 1;
    int32 system_update_seconds = 2;
    PresenceUpdate presence = 3;
    YellRequest yell = 4;
  }
  int32 message_world = 5; // with `message`: only this world shows it; 0 = every world
}

service Broadcasts {
  rpc Broadcast(BroadcastRequest) returns (Empty);
  rpc SystemUpdate(SystemUpdateRequest) returns (Empty);
  // Commands brief §6 ::yell and §1 hidden staff.
  rpc Yell(YellRequest) returns (Empty);
  rpc SetInvisible(InvisibleRequest) returns (Empty);
  rpc Subscribe(Empty) returns (stream BroadcastEvent);
}

// ---- world operations (panel plan §3 #13, #14): work the hub routes to one world, answered line by line.

message WorldOpRequest {
  int64 id = 1;
  string kind = 2; // "diag.threads", "diag.heap", "diag.jfr.start", "diag.jfr.stop", "diag.tick", "command"
  int64 actor_account = 3;
  string actor_name = 4;
  string actor_rank = 5; // tp.util.Rank stored value, checked by the hub before routing
  string args = 6;
}

message WorldOpLine {
  int64 id = 1;
  string line = 2;
  bool done = 3;
  bool error = 4;
}

service WorldOps {
  rpc Subscribe(WorldRef) returns (stream WorldOpRequest);
  rpc Reply(WorldOpLine) returns (Empty);
}

// ---- control panel (panel/docs/plan.md §3). Served only on the hub's mTLS panel listener, never to world nodes.
// The hub re-checks the actor's stored rank on every call; the panel's own checks are not trusted alone.

message PanelActor {
  int64 account_id = 1;
  string ip = 2; // the staff member's address, for the audit row
}

message VerifyStaffRequest {
  string username = 1;
  string password = 2;
  string ip = 3;
}

message VerifyStaffReply {
  string result = 1; // OK, INVALID_CREDENTIALS, THROTTLED, BANNED or NOT_STAFF
  int64 account_id = 2;
  string display_name = 3;
  string rank = 4; // tp.util.Rank stored value
}

message RankReply {
  bool exists = 1;
  string rank = 2;
  bool banned = 3;
  string display_name = 4;
}

message PanelAuditRequest {
  PanelActor actor = 1;
  string action = 2;
  string target = 3;
  string detail = 4;
  string result = 5;
}

message AuditQuery {
  PanelActor actor = 1;
  string by = 2; // actor filter
  string target = 3;
  string action = 4;
  string source = 5;
  string text = 6;
  int64 since_ms = 7;
  int64 until_ms = 8;
  int64 before_id = 9;
  int32 limit = 10;
}

message AuditRowPb {
  int64 id = 1;
  int64 at_ms = 2;
  string actor = 3;
  string action = 4;
  string target = 5;
  string detail = 6;
  string source = 7;
  string ip = 8;
  string result = 9;
}

message AuditRows {
  string error = 1;
  repeated AuditRowPb rows = 2;
}

message OnlineReply {
  string error = 1;
  repeated PresencePb players = 2;
}

message PanelWorld {
  int32 id = 1;
  string host = 2;
  int32 port = 3;
  string activity = 4;
  int32 flags = 5;
  int32 population = 6;
  bool locked = 7;
  int64 last_beat_ms = 8;
}

message PanelWorlds {
  string error = 1;
  repeated PanelWorld worlds = 2;
}

message LoginLockRequest {
  PanelActor actor = 1;
  int32 world_id = 2; // 0 = every world
  bool locked = 3;
  string message = 4;
}

message LoginLockPb {
  int32 world_id = 1;
  string message = 2;
}

message LoginLockState {
  string error = 1;
  repeated LoginLockPb locks = 2;
}

message PanelUpdateRequest {
  PanelActor actor = 1;
  int32 seconds = 2;
  string message = 3; // broadcast first when not empty
}

message PanelBroadcastRequest {
  PanelActor actor = 1;
  string text = 2;
  int32 world_id = 3; // 0 = every world
}

message PanelSanctionRequest {
  PanelActor actor = 1;
  string target = 2;
  string sanction = 3; // tp.util.Sanction name
  string reason = 4;
  sint64 duration_ms = 5; // -1 = permanent
}

message PanelTargetRequest {
  PanelActor actor = 1;
  string target = 2;
  string kind = 3; // Investigate: "alts", "ips" or "audit"
  string filter = 4;
}

message PanelSetRankRequest {
  PanelActor actor = 1;
  string target = 2;
  string rank = 3; // tp.util.Rank stored value
}

message SanctionsQuery {
  PanelActor actor = 1;
  string type = 2; // tp.util.RecordType name, empty = any
  string staff = 3; // actor name, empty = any
  bool active_only = 4;
  int32 limit = 5;
}

message SanctionRowPb {
  ModRecordPb record = 1;
  string account_name = 2;
}

message SanctionRows {
  string error = 1;
  repeated SanctionRowPb rows = 2;
}

message StaffRowPb {
  int64 account_id = 1;
  string name = 2;
  string rank = 3;
  int32 world_id = 4; // 0 = offline
}

// `lotus-panel bootstrap --account <name>` (panel brief §2): the first owner, run on the VPS. Refused once any account
// is an owner or a developer, so it can never be used to promote anyone later.
message BootstrapOwnerRequest {
  string username = 1;
}

message StaffRows {
  string error = 1;
  repeated StaffRowPb staff = 2;
}

message PanelWorldOpRequest {
  PanelActor actor = 1;
  int32 world_id = 2;
  string kind = 3;
  string args = 4;
}

message OpOutput {
  string line = 1;
  bool done = 2;
  bool error = 3;
}

service Panel {
  rpc VerifyStaff(VerifyStaffRequest) returns (VerifyStaffReply);
  rpc GetRank(AccountRef) returns (RankReply);
  rpc Audit(PanelAuditRequest) returns (ErrorReply);
  rpc QueryAudit(AuditQuery) returns (AuditRows);
  rpc ListOnline(PanelActor) returns (OnlineReply);
  rpc ListWorlds(PanelActor) returns (PanelWorlds);
  rpc SetLoginLock(LoginLockRequest) returns (ErrorReply);
  rpc GetLoginLock(PanelActor) returns (LoginLockState);
  rpc SystemUpdate(PanelUpdateRequest) returns (ErrorReply);
  rpc CancelUpdate(PanelActor) returns (ErrorReply);
  rpc Broadcast(PanelBroadcastRequest) returns (ErrorReply);
  rpc ApplySanction(PanelSanctionRequest) returns (ErrorReply);
  rpc History(PanelTargetRequest) returns (HistoryReply);
  rpc Lookup(PanelTargetRequest) returns (LookupReply);
  rpc Investigate(PanelTargetRequest) returns (LinesReply);
  rpc SetRank(PanelSetRankRequest) returns (ErrorReply);
  rpc ListSanctions(SanctionsQuery) returns (SanctionRows);
  rpc ListStaff(PanelActor) returns (StaffRows);
  rpc BootstrapOwner(BootstrapOwnerRequest) returns (ErrorReply);
  rpc WorldOp(PanelWorldOpRequest) returns (stream OpOutput);
}
