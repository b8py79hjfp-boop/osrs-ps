# Every version here was checked against Maven Central / Gradle Plugin Portal on 2026-11-05.
# See docs/DECISIONS.md D-003 for the toolchain record.
[versions]
java = "25"
kotlin = "2.4.21"
ksp = "2.3.13"
coroutines = "1.11.0"
serialization = "1.12.0"
netty = "4.2.20.Final"
rsmod-pathfinder = "5.0.0"
asm = "9.11.1"
commons-compress = "1.28.0"
bouncycastle = "1.86"
ktoml = "0.7.1"
kotlin-logging = "8.0.4"
logback = "1.5.38"
junit = "6.1.3"
spotless = "8.9.0"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"
foojay = "1.0.0"
# RSProt: shared modules published and unchanged at the 242 commit (D-005); osrs-242 itself is vendored.
rsprot = "1.0.0-ALPHA-20261014"
inline-logger = "1.0.6"
commons-pool2 = "2.13.1"
fastutil = "8.5.19"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer" }
netty-transport = { module = "io.netty:netty-transport" }
netty-handler = { module = "io.netty:netty-handler" }
netty-codec-http = { module = "io.netty:netty-codec-http" }
netty-native-epoll = { module = "io.netty:netty-transport-native-epoll" }
netty-native-kqueue = { module = "io.netty:netty-transport-native-kqueue" }
netty-native-iouring = { module = "io.netty:netty-transport-native-io_uring" }
netty-native-macos-dns-resolver = { module = "io.netty:netty-resolver-dns-native-macos" }
rsprot-buffer = { module = "net.rsprot:buffer", version.ref = "rsprot" }
rsprot-crypto = { module = "net.rsprot:crypto", version.ref = "rsprot" }
rsprot-compression = { module = "net.rsprot:compression", version.ref = "rsprot" }
rsprot-haproxy = { module = "net.rsprot:haproxy", version.ref = "rsprot" }
rsprot-protocol = { module = "net.rsprot:protocol", version.ref = "rsprot" }
inline-logger = { module = "com.michael-bull.kotlin-inline-logger:kotlin-inline-logger", version.ref = "inline-logger" }
commons-pool2 = { module = "org.apache.commons:commons-pool2", version.ref = "commons-pool2" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
rsmod-pathfinder = { module = "org.rsmod:rsmod-pathfinder", version.ref = "rsmod-pathfinder" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
ktoml-core = { module = "com.akuleshov7:ktoml-core", version.ref = "ktoml" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# build-logic classpath
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
