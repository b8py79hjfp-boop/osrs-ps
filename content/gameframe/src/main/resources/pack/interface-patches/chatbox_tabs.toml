# D-096 chatbox re-skin: Mentions, Yell and Staff tabs on the chatbox (interface 162). The seven official tabs
# (layers 4..27, 62 px apart and 56 wide in the cache) are narrowed to 41 px, 43 apart, so ten tabs fit left of Report
# (x 3 from the right edge, 79 wide). Script 178 resizes the tab graphics at runtime, so chatbox_tabs.diff patches its sizes
# to the same 41 x 22. The new tabs copy the official tabs' layout modes (dumpif 162): layer m0101 y 0 height minus 0,
# graphic centred at the bottom (y 1) on sprite 3051, text font 494 white, width minus 0.

[[patch]]
interface = 162
name = "chatbox"
base_components = 569

[[set]]
component = 4
x = 3
width = 41

[[set]]
component = 5
width = 41

[[set]]
component = 7
x = 46
width = 41

[[set]]
component = 8
width = 41

[[set]]
component = 11
x = 89
width = 41

[[set]]
component = 12
width = 41

[[set]]
component = 15
x = 132
width = 41

[[set]]
component = 16
width = 41

[[set]]
component = 19
x = 175
width = 41

[[set]]
component = 20
width = 41

[[set]]
component = 23
x = 218
width = 41

[[set]]
component = 24
width = 41

[[set]]
component = 27
x = 261
width = 41

[[set]]
component = 28
width = 41

[[component]]
name = "tab_mentions"
type = "layer"
parent = 1
x = 304
width = 41
y_mode = "abs_centre"
height_mode = "minus"
hidden = false
options = ["Switch tab"]
on_op = ["clientscript.tp_chat_tab", "mentions"]
on_mouse_over = ["clientscript.tp_chat_tab_hover", "component.chatbox:tab_mentions_graphic", "mentions", 1]
on_mouse_leave = ["clientscript.tp_chat_tab_hover", "component.chatbox:tab_mentions_graphic", "mentions", 0]

[[component]]
name = "tab_mentions_graphic"
type = "graphic"
parent = "tab_mentions"
y = 1
width = 41
height = 22
x_mode = "abs_centre"
y_mode = "abs_bottom"
sprite = 3051

[[component]]
name = "tab_mentions_text"
type = "text"
parent = "tab_mentions"
y = 1
height = 22
x_mode = "abs_centre"
y_mode = "abs_bottom"
width_mode = "minus"
text = "Mentions"
font = 494
color = "#FFFFFF"
h_align = "centre"
v_align = "centre"

[[component]]
name = "tab_yell"
type = "layer"
parent = 1
x = 347
width = 41
y_mode = "abs_centre"
height_mode = "minus"
hidden = false
options = ["Switch tab"]
on_op = ["clientscript.tp_chat_tab", "yell"]
on_mouse_over = ["clientscript.tp_chat_tab_hover", "component.chatbox:tab_yell_graphic", "yell", 1]
on_mouse_leave = ["clientscript.tp_chat_tab_hover", "component.chatbox:tab_yell_graphic", "yell", 0]

[[component]]
name = "tab_yell_graphic"
type = "graphic"
parent = "tab_yell"
y = 1
width = 41
height = 22
x_mode = "abs_centre"
y_mode = "abs_bottom"
sprite = 3051

[[component]]
name = "tab_yell_text"
type = "text"
parent = "tab_yell"
y = 1
height = 22
x_mode = "abs_centre"
y_mode = "abs_bottom"
width_mode = "minus"
text = "Yell"
font = 494
color = "#FFFFFF"
h_align = "centre"
v_align = "centre"

[[component]]
name = "tab_staff"
type = "layer"
parent = 1
x = 390
width = 41
y_mode = "abs_centre"
height_mode = "minus"
hidden = true
options = ["Switch tab"]
on_op = ["clientscript.tp_chat_tab", "staff"]
on_mouse_over = ["clientscript.tp_chat_tab_hover", "component.chatbox:tab_staff_graphic", "staff", 1]
on_mouse_leave = ["clientscript.tp_chat_tab_hover", "component.chatbox:tab_staff_graphic", "staff", 0]

[[component]]
name = "tab_staff_graphic"
type = "graphic"
parent = "tab_staff"
y = 1
width = 41
height = 22
x_mode = "abs_centre"
y_mode = "abs_bottom"
sprite = 3051

[[component]]
name = "tab_staff_text"
type = "text"
parent = "tab_staff"
y = 1
height = 22
x_mode = "abs_centre"
y_mode = "abs_bottom"
width_mode = "minus"
text = "Staff"
font = 494
color = "#FFFFFF"
h_align = "centre"
v_align = "centre"

# The selected custom tab ("", "mentions", "yell" or "staff"), read by the patched chat filter (193) and tab art (178).
# A component text, not a new varc: 21 cache scripts read CHAT_VIEW (varc 41) and would misbehave on new values.
[[component]]
name = "tp_chat_state"
type = "text"
parent = 1
hidden = true
font = 494

# The online roster for name colours and icons, set by the server with IF_SETTEXT: ";name=icon,rrggbb;" per player.
[[component]]
name = "tp_chat_roster"
type = "text"
parent = 1
hidden = true
font = 494
